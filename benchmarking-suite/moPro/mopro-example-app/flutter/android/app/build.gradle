plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release signing — provide android/key.properties (gitignored, see
// key.properties.example). Never ship a bundle signed with the debug key.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def moproLibraryFile = rootProject.file('../mopro_flutter_plugin/android/src/main/jniLibs/arm64-v8a/libmopro_example_app.so')
def moproCxxRuntimeFile = rootProject.file('../mopro_flutter_plugin/android/src/main/jniLibs/arm64-v8a/libc++_shared.so')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    if (!keystorePropertiesFile.exists()) {
        throw new GradleException('Release signing requires android/key.properties')
    }
    ['keyAlias', 'keyPassword', 'storeFile', 'storePassword'].each { property ->
        if (!keystoreProperties[property]) {
            throw new GradleException("Release signing requires ${property} in android/key.properties")
        }
    }
    if (!file(keystoreProperties['storeFile']).isFile()) {
        throw new GradleException('Release signing keystore file does not exist')
    }
    if (!moproLibraryFile.isFile() || !moproCxxRuntimeFile.isFile()) {
        throw new GradleException('Build the Android Mopro library with flutter/scripts/build_mopro_android.sh before release')
    }
}

android {
    namespace "com.example.mopro_flutter_example"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Must match the Deimos app already created in Play Console.
        applicationId "deimos.labs.com"
        // The generated Mopro library is available for arm64 only.
        ndk {
            abiFilters.clear()
            abiFilters.add('arm64-v8a')
        }
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
    }
}

flutter {
    source '../..'
}

// IMP1 is excluded from the first Play release until its SDK supports 16 KB pages.
