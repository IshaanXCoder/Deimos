name: Deimos
description: "zK Benchmarking on your mobile phones"
# versionName+versionCode for store releases (bump the build number each upload).
version: 1.0.0+1
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ">=3.3.4 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  mopro_flutter:
    # When depending on this package from a real application you should use:
    #   mopro_flutter: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: ./mopro_flutter_plugin

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  path_provider: ^2.0.0
  
  # Device info and HTTP client
  device_info_plus: ^10.1.0
  http: ^1.2.0
  system_info2: ^4.0.0
  battery_plus: ^6.0.3
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^3.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/barretenberg/
    # Larger Groth16 byte-input keys push the base module beyond Play's
    # compressed download limit. The UI and batch registry offer 16/32 only.
    - assets/groth16/zkey/blake2s256_16.zkey
    - assets/groth16/zkey/blake2s256_32.zkey
    - assets/groth16/zkey/blake3_16.zkey
    - assets/groth16/zkey/blake3_32.zkey
    - assets/groth16/zkey/keccak256_16.zkey
    - assets/groth16/zkey/keccak256_32.zkey
    - assets/groth16/zkey/pedersen_16.zkey
    - assets/groth16/zkey/pedersen_32.zkey
    - assets/groth16/zkey/sha256_16.zkey
    - assets/groth16/zkey/sha256_32.zkey
    - assets/groth16/zkey/mimc256_1f.zkey
    - assets/groth16/zkey/mimc256_2f.zkey
    - assets/groth16/zkey/mimc256_3f.zkey
    - assets/groth16/zkey/mimc256_5f.zkey
    - assets/groth16/zkey/mimc256_9f.zkey
    - assets/groth16/zkey/mimc256_17f.zkey
    - assets/groth16/zkey/mimc256_34f.zkey
    - assets/groth16/zkey/poseidon_1f.zkey
    - assets/groth16/zkey/poseidon_2f.zkey
    - assets/groth16/zkey/poseidon_3f.zkey
    - assets/groth16/zkey/poseidon_5f.zkey
    - assets/groth16/zkey/poseidon_9f.zkey
    - assets/groth16/zkey/poseidon_17f.zkey
    - assets/groth16/zkey/poseidon_34f.zkey
    - assets/groth16/zkey/poseidon2_1f.zkey
    - assets/groth16/zkey/poseidon2_2f.zkey
    - assets/groth16/zkey/poseidon2_3f.zkey
    - assets/groth16/zkey/poseidon2_5f.zkey
    - assets/groth16/zkey/poseidon2_9f.zkey
    - assets/groth16/zkey/poseidon2_17f.zkey
    - assets/groth16/zkey/poseidon2_34f.zkey
    - assets/groth16/zkey/rescue-prime_1f.zkey
    - assets/groth16/zkey/rescue-prime_2f.zkey
    - assets/groth16/zkey/rescue-prime_3f.zkey
    - assets/groth16/zkey/rescue-prime_5f.zkey
    - assets/groth16/zkey/rescue-prime_9f.zkey
    - assets/groth16/zkey/rescue-prime_17f.zkey
    - assets/groth16/zkey/rescue-prime_34f.zkey
    - assets/groth16/vk/
    - assets/groth16/wtns/
    - inputs/input_1.json
    - inputs/input_2.json
    - inputs/input_3.json
    - inputs/bytes/
    - inputs/field_elements/
    - inputs/m31_field/
    - inputs/u32/
    - inputs/cairo_input.json
    - assets/cairo-m/
    - assets/cairo_input.json
    - assets/provekit/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

